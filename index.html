         og:image / og:url 需绝对地址，且爬虫不执行 JS，无法按 origin 动态拼 —— 写死主域名。
         换主域名时同步改下面 3 处 URL。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="工作室 · AIGC 影像创作" />
    <meta property="og:title" content="工作室 · AIGC 影像创作" />
